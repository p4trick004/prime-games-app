<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Prime Games — Reset password</title>
  <script>
    // Supabase redirects the recovery email here with the session in the URL
    // fragment (implicit flow). HashRouter owns the fragment inside /portal/,
    // so hand the tokens over through sessionStorage, then replace the history
    // entry so the tokens do not linger in the address bar or history.
    (function () {
      var params = new URLSearchParams(location.hash.replace(/^#/, ""));
      var access = params.get("access_token");
      var refresh = params.get("refresh_token");
      var type = params.get("type");
      var failed = params.get("error") || params.get("error_description");
      var target = "/portal/#/reset-password";
      if (access && refresh && (!type || type === "recovery")) {
        try {
          sessionStorage.setItem("pg_recovery", JSON.stringify({ access_token: access, refresh_token: refresh }));
        } catch (e) {
          target += "?error=storage";
        }
      } else if (failed || type === "recovery") {
        target += "?error=expired";
      }
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Opening the Prime Games password reset… <a href="/portal/#/reset-password">Continue</a></p>
</body>
</html>
